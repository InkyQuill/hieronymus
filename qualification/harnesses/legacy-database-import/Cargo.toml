[package]
name = "hieronymus-legacy-database-import-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[[bin]]
name = "legacy-database-import"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
