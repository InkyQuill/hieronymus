[package]
name = "hieronymus-frontend-embedding-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
build = "build.rs"

[[bin]]
name = "frontend-embedding"
path = "src/main.rs"

[dependencies]
anyhow = "1"
mime_guess = "2"
percent-encoding = "2"
rust-embed = { version = "=8.12.0", features = ["debug-embed", "deterministic-timestamps", "interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
