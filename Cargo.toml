[workspace]
members = ["crates/hiero-core", "crates/hiero-bin"]
resolver = "2"

[workspace.package]
version = "0.6.0"
authors = ["Pavel Obruchnikov <me@inkyquill.net>"]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
async-openai = "0.27"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
colored = "2"
csv = "1"
fs4 = "0.8"
indicatif = "0.17"
libc = "0.2"
lancedb = "0.17"
mime_guess = "2"
ort = "2.0.0-rc.12"
percent-encoding = "2"
phf = { version = "0.12", features = ["macros"] }
pulldown-cmark = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = "0.4"
rust-embed = "8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
winapi-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
