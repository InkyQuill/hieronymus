[workspace]
resolver = "3"
members = ["crates/hieronymus", "crates/hiero"]
exclude = ["qualification", "tests/qualification/fixtures/process-smoke"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.7.0"
license = "MIT"

[workspace.dependencies]
indexmap = "2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "collation"] }
home = "0.5"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
thiserror = "2"
toml = { version = "0.8", features = ["preserve_order"] }
sha2 = "0.10"
csv = "1"
serde_yaml_ng = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
pdf-extract = "0.12"
getrandom = "0.4"
ctrlc = "3"

