[package]
name = "hieronymus"
description = "Hieronymus domain library: configuration, secrets, data-root, storage."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
url = "2"
home.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
serde = { version = "1", features = ["derive"] }
indexmap.workspace = true
rusqlite.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2.workspace = true
csv.workspace = true
serde_yaml_ng.workspace = true
zip.workspace = true
quick-xml.workspace = true
pdf-extract.workspace = true

serde_json.workspace = true

# Semantic RAG data plane, pinned to the qualified stack (ADR 0013,
# qualification/records/semantic-native.json: decision semantic-enabled).
# Versions and features are copied verbatim from the qualification harness.
arrow-array = "=58.3.0"
arrow-schema = "=58.3.0"
futures = "0.3"
lancedb = { version = "=0.37.1", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
  "api-28",
  "load-dynamic",
  "ndarray",
  "std",
  "tracing",
] }
tokio = { version = "1", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "time",
] }
# Pinned WordPiece tokenizer for the pinned MiniLM model (same revision as
# the ONNX file; identity carried in `semantic_tokenizer`).
tokenizers = { version = "=0.23.2", default-features = false, features = [
  "onig",
] }

# Outbound TLS for provider calls and model downloads (rustls, ring backend,
# static webpki root store — see ADR 0013 and the tls module docs).
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
serde_json = "1"
# Loopback TLS servers and locally generated self-signed certificates for the
# transport-seam tests; never used outside `cargo test`.
rcgen.workspace = true
rustls.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
