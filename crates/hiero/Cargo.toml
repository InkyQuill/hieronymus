[package]
name = "hiero"
default-run = "hiero"
description = "Hieronymus command-line binary and local daemon."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# Release backend: embed the production console bundle (`frontend/dist`) at
# compile time. Default OFF so ordinary developer tests never need Bun or the
# bundle; release builds enable it through `scripts/release-build.sh`, which
# builds the bundle first (spec §Build Ownership).
console-embed = ["dep:rust-embed"]

[dependencies]
roxmltree = "=0.21.1"
url = "2"
flate2 = "1"
tar = "0.4"
zip.workspace = true
hieronymus = { path = "../hieronymus" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
getrandom.workspace = true
ctrlc.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
base64.workspace = true
sha1.workspace = true
home.workspace = true
# Temporary files for local tooling and tests.
tempfile.workspace = true
# Descriptor-relative export publication; version already present in Cargo.lock.
# Release archive verification (`hiero update`, byte-for-byte parity with the
# bootstrap installer's sha256sum check).
sha2.workspace = true
# The embedded console lookup/iteration (security spec §HTTP And Frontend
# Contracts). `debug-embed` makes even test/debug builds carry the real
# compile-time bytes; `interpolate-folder-path` resolves the bundle outside
# `crates/hiero`.
rust-embed = { version = "8", optional = true, features = [
  "debug-embed",
  "interpolate-folder-path",
] }

[dev-dependencies]
rustls.workspace = true
rcgen.workspace = true
rusqlite.workspace = true
# `tempfile` is a normal dependency (see above), so tests inherit it.

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemServices", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
