[package]
name = "hiero-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hiero = { path = "../hiero" }
hieronymus = { path = "../hieronymus" }
ico = "=0.5.0"
png = "=0.18.1"
resvg = { version = "=0.48.1", default-features = false }

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true

[[bin]]
name = "build-icons"
path = "src/bin/build-icons.rs"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
tray-icon = { version = "=0.24.2", default-features = false, features = ["gtk"] }

[[bin]]
name = "hiero-desktop"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSMenu", "NSActionCell", "NSApplication", "NSAppearance", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSColorSpace", "NSControl", "NSImage", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSView", "NSWindow", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSData", "NSDate", "NSNotification", "NSRunLoop", "NSString", "NSTimer", "block2"] }
block2 = "=0.6.2"
