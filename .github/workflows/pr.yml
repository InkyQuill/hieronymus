name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      # oven-sh/setup-bun v2 pinned to commit SHA for reproducibility.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"

      # Fresh runners do not restore .venv, so uv sync installs the editable project and Hatch builds the frontend.
      - run: uv sync --dev
      - name: Check retained historical compatibility fixtures
        run: |
          set -o pipefail
          uv run --no-cache --no-sync python -B -m tools.compatibility.check --historical-test-inventory compatibility/snapshots/state.json | tee historical-fixture-validation.txt

      - name: Upload historical fixture validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-fixture-validation
          path: historical-fixture-validation.txt
          if-no-files-found: error

      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2 pinned to commit SHA for reproducibility.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"

      - run: bun install --cwd frontend --frozen-lockfile
      - run: bun run --cwd frontend format
      - run: bun run --cwd frontend typecheck
      - run: bun run --cwd frontend test
      - run: bun run --cwd frontend build
