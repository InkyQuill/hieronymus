name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version
          ./scripts/check-protobuf.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - run: bun test scripts/*.test.ts
      - run: bun install --cwd frontend --frozen-lockfile
      - run: bun run --cwd frontend build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-features --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --locked

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      # oven-sh/setup-bun v2 pinned to commit SHA for reproducibility.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"

      - run: bun install --cwd frontend --frozen-lockfile
      - run: bun run --cwd frontend format
      - run: bun run --cwd frontend typecheck
      - run: bun run --cwd frontend test
      - run: bun run --cwd frontend build
