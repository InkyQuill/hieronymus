# Evidence lives on a separate data commit, avoiding source/evidence circularity.
name: desktop-evidence
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful desktop-candidate run ID for this exact workflow ref
        required: true
        type: string
      evidence_commit:
        description: Full commit SHA containing qualification/desktop-evidence data only
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      EVIDENCE_COMMIT: ${{ inputs.evidence_commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - name: Validate immutable input identities
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$EVIDENCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - name: Download same-source successful candidates
        run: bun scripts/desktop-ci.ts download "$CANDIDATE_RUN" desktop-candidate target/candidate "$GITHUB_SHA"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.evidence_commit }}
          path: evidence-source
          persist-credentials: false
          sparse-checkout: qualification/desktop-evidence
      - name: Validate and copy only bounded evidence data
        run: bun scripts/package-desktop-evidence.ts target/candidate evidence-source/qualification/desktop-evidence target/evidence "$GITHUB_SHA" "$CANDIDATE_RUN" "$EVIDENCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-evidence
          path: target/evidence/
          if-no-files-found: error
          retention-days: 90
