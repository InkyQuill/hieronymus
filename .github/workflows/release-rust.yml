# Publish retained binary bytes; packaging-only edits can reuse a compatible candidate.
name: release-rust
on:
  push:
    tags: ["v*"]
concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installers:
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/installer-checks.yml
    with:
      candidate_run: ${{ vars.DESKTOP_CANDIDATE_RUN }}
  promote:
    needs: installers
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_RUN: ${{ vars.DESKTOP_CANDIDATE_RUN }}
      EVIDENCE_RUN: ${{ vars.DESKTOP_EVIDENCE_RUN }}
      RELEASE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - name: Verify exact source and tag
        run: bun scripts/check-rust-release.ts --ref "$RELEASE_REF"
      - name: Fetch retained candidate
        id: candidate
        run: |
          bun scripts/desktop-ci.ts download "$CANDIDATE_RUN" desktop-candidate target/candidate "$GITHUB_SHA"

      - name: Optional desktop evidence
        id: evidence
        continue-on-error: true
        run: |
          bun scripts/desktop-ci.ts download "$EVIDENCE_RUN" desktop-evidence target/evidence
          bun scripts/package-desktop-evidence.ts --verify target/candidate target/evidence "${{ steps.candidate.outputs.commit }}" "$CANDIDATE_RUN"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-installers
          path: target/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: native-download
        continue-on-error: true
        with:
          pattern: native-installer-*
          merge-multiple: true
          path: target/setup
      - name: Check open P0 issues
        run: |
          count=$(gh issue list --state open --label P0 --json number --jq length)
          [ "$count" = 0 ] || { echo "::error::Open P0 issues block publication"; exit 1; }
      - name: Publish exact retained and verified bytes without rebuilding
        run: bun scripts/desktop-ci.ts publish target/candidate "$GITHUB_SHA" "$RELEASE_REF" target/evidence "$CANDIDATE_RUN" target/setup
      - name: File release warnings as issues
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CHECK_RESULTS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: bash scripts/report-release-warnings.sh
