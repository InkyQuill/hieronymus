# Rust is the sole release publisher. Historical Python tags/assets are retained.
# The release environment is declared here; remote required-reviewer settings
# must be independently configured/verified (distribution spec Build Ownership).
# Checksum-only signing/SBOM/provenance waiver remains in force.
name: release-rust

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ github.ref }}
      HIERONYMUS_RELEASE_CHANNEL: stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify exact Rust source and tag
        run: python scripts/check-rust-release.py --ref "$RELEASE_REF"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --target x86_64-unknown-linux-gnu
      - name: Acquire and verify pinned native assets
        run: python scripts/stage-release-assets.py --github-env "$GITHUB_ENV"
      - name: Build the release artifacts
        run: ./scripts/release-build.sh
      - name: Verify packaged version and archive metadata
        run: python scripts/check-rust-release.py --ref "$RELEASE_REF" --release-dir target/release-dist --channel stable
      - name: Publish the verified GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check-rust-release.py --ref "$RELEASE_REF" --release-dir target/release-dist --channel stable
          archive="target/release-dist/$(python -c 'import json; print(json.load(open("target/release-dist/release.json"))["archive"])')"
          checksums="${archive}.sha256"
          test -f "$checksums"
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Rust alpha release

          Linux x86_64, Rust 1.96.0; console built with pinned Bun 1.4.0.
          Bundled native semantic inference is mandatory. An unavailable model/runtime
          makes semantic retrieval unready; lexical results do not qualify semantics.

          Contents include the native hiero binary and command links, ONNX runtime,
          multilingual model/tokenizer, licenses/notices, verified assets.json,
          archive SHA-256 checksum, and release.json binding exact archive metadata.
          Installed host/model workflow acceptance is recorded separately; a generated
          plugin or historical qualification record does not qualify this artifact.

          Signing, SBOM and provenance retain the initial Rust-line waiver. The release
          environment declaration does not prove remote reviewer settings. These three
          downloadable assets support local --release-dir installation. They do not
          establish a deployed channel update feed or authorize a public feed URL.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "hiero $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "$archive" "$checksums" "target/release-dist/release.json"
