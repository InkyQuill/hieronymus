# Sole publisher: exact matching tag, successful same-source runs, same final bytes.
name: release-rust
on:
  push:
    tags: ["v*"]
concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_RUN: ${{ vars.DESKTOP_CANDIDATE_RUN }}
      EVIDENCE_RUN: ${{ vars.DESKTOP_EVIDENCE_RUN }}
      RELEASE_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.0"
      - name: Verify exact source and tag
        run: bun scripts/check-rust-release.ts --ref "$RELEASE_REF"
      - name: Fetch immutable successful same-source candidate and evidence runs
        run: |
          bun scripts/desktop-ci.ts download "$CANDIDATE_RUN" desktop-candidate target/candidate "$GITHUB_SHA"
          bun scripts/desktop-ci.ts download "$EVIDENCE_RUN" desktop-evidence target/evidence "$GITHUB_SHA"
      - name: Verify complete matrix and evidence provenance again
        run: bun scripts/package-desktop-evidence.ts --verify target/candidate target/evidence "$GITHUB_SHA" "$CANDIDATE_RUN"
      - name: Publish exact retained and verified bytes without rebuilding
        run: bun scripts/desktop-ci.ts publish target/candidate "$GITHUB_SHA" "$RELEASE_REF"
